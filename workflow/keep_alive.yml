name: Keep HF Space Alive

on:
  schedule:
    # 每 6 小時自動運航一次（避開休眠）
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: |
          curl -s https://tnno-rl-bitcoin-trading-dashboard.hf.space > /dev/null
          echo "Space Pinged & Awakened successfully at $(date)"
